<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mineral | 收藏库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #08080d;
      --surface: #111119;
      --border: rgba(255, 255, 255, 0.06);
      --text: #e0e0e0;
      --text-muted: #888;
      --text-dim: #555;
      --accent: #4fc3f7;
      --accent-dim: rgba(79, 195, 247, 0.12);
      --radius: 14px;
      color-scheme: dark;
      --heading: #fff;
      --dialog: #12121a;
      --field: rgba(255, 255, 255, 0.04);
      --popup: #1a1a2a;
      --action-surface: #1c1c27;
      --on-accent: #081018;
      --overlay: rgba(0, 0, 0, 0.6);
      --focus: rgba(79, 195, 247, 0.5);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 195, 247, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 195, 247, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .logo { font-size: 32px; }

    .header-text h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: -0.5px;
    }

    .header-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Add button */
    .add-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .add-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: scale(1.05);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--dialog);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 90%;
      max-width: 460px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      transform: translateY(10px);
      transition: transform 0.25s;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 20px;
    }

    .modal label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      margin-top: 14px;
    }

    .modal label:first-of-type { margin-top: 0; }

    .modal input, .modal textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal input:focus, .modal textarea:focus {
      border-color: var(--focus);
    }

    input::placeholder, textarea::placeholder { color: var(--text-dim); opacity: 1; }

    .modal textarea { resize: vertical; min-height: 50px; }

    /* Autocomplete */
    .autocomplete-wrap {
      position: relative;
    }

    .autocomplete-list {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--popup);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .autocomplete-list.show {
      display: block;
    }

    .autocomplete-item {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .autocomplete-item .cat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-cancel:hover {
      border-color: var(--text-muted);
    }

    .btn-save {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    .btn-save:hover {
      opacity: 0.85;
    }

    .btn-save:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--popup);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--accent);
      z-index: 2000;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Access Gate */
    .access-gate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 24px;
    }

    .access-gate::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 195, 247, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 195, 247, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .access-crystal {
      font-size: 56px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(79, 195, 247, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    .access-title {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .access-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .access-box input {
      width: 180px;
      padding: 12px 16px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Inter', monospace;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .access-box input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 20px rgba(79, 195, 247, 0.1);
    }

    .access-box input.shake {
      animation: shake 0.4s ease;
      border-color: rgba(244, 67, 54, 0.5);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    .access-enter {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .access-enter:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .access-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: -8px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--focus);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
    }

    /* Category filters */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(79, 195, 247, 0), rgba(79, 195, 247, 0));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      transition: background 0.3s;
      pointer-events: none;
    }

    .card:hover::before {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.4), rgba(156, 39, 176, 0.2));
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      border-color: rgba(79, 195, 247, 0.15);
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-width: 0;
      border-radius: 6px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .card-top {
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title {
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      color: var(--heading);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 9px;
      border-radius: 12px;
      background: var(--accent-dim);
      color: var(--accent);
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
      min-height: 37.5px;
      max-height: 37.5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-url {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .card-date {
      flex-shrink: 0;
      font-size: 10px;
      color: var(--text-dim);
    }

    .card-arrow {
      font-size: 13px;
      color: var(--text-dim);
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Tags */
    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--field);
      color: var(--text-dim);
    }

    /* Category footer; actions have their own space in the header. */
    .card-management {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .card-actions {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
    }

    .card-action-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--action-surface);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s;
    }

    .card-action-btn svg { width: 16px; height: 16px; pointer-events: none; }
    .card-action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .card-action-btn.delete:hover { border-color: #e05252; color: #e05252; }
    .card-action-btn:focus-visible, .card-link:focus-visible, .card-top:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (pointer: coarse), (max-width: 600px) {
      .card-action-btn { width: 44px; height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none !important; opacity: 1; transition: none; }
      .card:hover { transform: none; }
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Animations */
    .card {
      opacity: 0;
      animation: fadeUp 0.35s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 32px 14px; }
      .grid { grid-template-columns: 1fr; }
      .header { flex-wrap: wrap; }
      .stats { margin-left: 0; margin-top: 8px; width: 100%; }
      .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
      .search-box { min-width: 0; }
      .filters { grid-column: 1 / -1; grid-row: 2; }
      .add-btn { grid-column: 2; grid-row: 1; }
      .modal { padding: 24px; }
      .modal input, .modal textarea { font-size: 16px; }
    }

    /* Light theme */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --surface: #fff;
        --border: rgba(0, 0, 0, 0.06);
        --text: #333;
        --text-muted: #666;
        --text-dim: #757575;
        --accent: #1565c0;
        --accent-dim: rgba(21, 101, 192, 0.08);
        color-scheme: light;
        --heading: #111;
        --dialog: #fff;
        --field: #f2f2f7;
        --popup: #fff;
        --action-surface: #fff;
        --on-accent: #fff;
        --overlay: rgba(24, 28, 36, 0.3);
        --focus: rgba(21, 101, 192, 0.5);
      }
      body::before {
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      }
      .card-title { color: #111; }
      .card:hover { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); }
    }
  </style>
</head>
<body>
  <!-- Access Gate -->
  <div class="access-gate" id="access-gate">
    <div class="access-crystal">💎</div>
    <div class="access-title">Mineral</div>
    <div class="access-box">
      <input type="password" id="access-input" maxlength="6" placeholder="····" autocomplete="off">
      <button class="access-enter" id="access-submit">→</button>
    </div>
    <div class="access-hint">enter access code</div>
  </div>

  <div class="container">
    <div class="header">
      <div class="logo">💎</div>
      <div class="header-text">
        <h1>Mineral</h1>
        <p>收藏库 · 值得反复访问的网站</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="搜索书签..." autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>
      <button class="add-btn" id="addBtn" title="添加书签">+</button>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h2>✨ 添加收藏</h2>
        <label>URL *</label>
        <input type="url" id="m-url" placeholder="https://..." autocomplete="off">
        <div id="m-fetching" role="status" aria-live="polite" style="font-size:12px;line-height:1.5;color:var(--text-muted);margin-top:6px;display:none">✨ 正在获取网站信息...</div>
        <label>标题</label>
        <input type="text" id="m-title" placeholder="网站名称（留空自动获取）">
        <label>描述</label>
        <textarea id="m-desc" placeholder="一句话介绍"></textarea>
        <label>分类</label>
        <div class="autocomplete-wrap" id="cat-wrap">
          <input type="text" id="m-cat" placeholder="输入或选择分类" autocomplete="off">
          <div class="autocomplete-list" id="cat-list"></div>
        </div>
        <label>标签（逗号分隔）</label>
        <input type="text" id="m-tags" placeholder="ai, tool, design">
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancel">取消</button>
          <button class="btn-save" id="modalSave">保存</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="empty-icon">🔮</div>
      <p>没有匹配的书签</p>
    </div>
  </div>

  <script>
    let bookmarks = [];
    let activeCategory = 'All';
    let searchQuery = '';
    let ACCESS_CODE = '';

    // Access gate - custom modal instead of prompt()
    (function checkAccess() {
      const saved = sessionStorage.getItem('mineral_access');
      if (saved === 'granted') { ACCESS_CODE = '0824'; return; }
      // Show custom access gate
      document.getElementById('access-gate').style.display = 'flex';
      document.querySelector('.container').style.display = 'none';
      document.getElementById('access-input').focus();
    })();

    function submitAccess() {
      const input = document.getElementById('access-input');
      const code = input.value.trim();
      const gate = document.getElementById('access-gate');
      if (code === '0824') {
        sessionStorage.setItem('mineral_access', 'granted');
        ACCESS_CODE = code;
        gate.style.display = 'none';
        document.querySelector('.container').style.display = 'block';
        init();
      } else {
        input.classList.add('shake');
        input.value = '';
        setTimeout(() => input.classList.remove('shake'), 500);
      }
    }

    document.getElementById('access-submit')?.addEventListener('click', submitAccess);
    document.getElementById('access-input')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAccess();
    });

    async function init() {
      const res = await fetch('data/bookmarks.json');
      bookmarks = await res.json();
      renderFilters();
      render();
      document.getElementById('stats').textContent = `${bookmarks.length} 个收藏`;
    }

    function getCategories() {
      const cats = [...new Set(bookmarks.map(b => b.category))];
      cats.sort();
      return ['All', ...cats];
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
    }

    function renderFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = getCategories().map(cat =>
        `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${escapeHTML(cat)}">${cat === 'All' ? '全部' : escapeHTML(cat)}</button>`
      ).join('');

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderFilters();
          render();
        });
      });
    }

    function getFavicon(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
      } catch { return ''; }
    }

    function matchesSearch(b) {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return (
        b.title.toLowerCase().includes(q) ||
        b.description.toLowerCase().includes(q) ||
        (b.tags || []).some(t => t.toLowerCase().includes(q)) ||
        b.url.toLowerCase().includes(q)
      );
    }

    function matchesCategory(b) {
      return activeCategory === 'All' || b.category === activeCategory;
    }

    function getDomain(url) {
      try { return new URL(url).hostname.replace('www.', ''); }
      catch { return url; }
    }

    function render() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const filtered = bookmarks.filter(b => matchesCategory(b) && matchesSearch(b));

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = filtered.map((b, i) => {
        const realIndex = bookmarks.indexOf(b);
        return `
        <div class="card" style="animation-delay: ${i * 0.04}s">
          <div class="card-header">
            <a class="card-top" href="${escapeHTML(b.url)}" target="_blank" rel="noopener" title="${escapeHTML(b.title)}">
              <div class="card-title">${escapeHTML(b.title)}</div>
            </a>
            <div class="card-actions">
              <button class="card-action-btn edit" data-idx="${realIndex}" title="编辑" aria-label="编辑 ${escapeHTML(b.title)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m14 5 5 5"/></svg>
              </button>
              <button class="card-action-btn delete" data-idx="${realIndex}" title="删除" aria-label="删除 ${escapeHTML(b.title)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
              </button>
            </div>
          </div>
          <a class="card-link" href="${escapeHTML(b.url)}" target="_blank" rel="noopener">
            <div class="card-desc">${escapeHTML(b.description)}</div>
            ${b.tags && b.tags.length ? `<div class="card-tags">${b.tags.map(t => `<span class="tag">#${escapeHTML(t)}</span>`).join('')}</div>` : ''}
            <div class="card-footer">
              <span class="card-url">${escapeHTML(getDomain(b.url))}</span>
              <span class="card-date">${escapeHTML(b.added || '')}</span>
              <span class="card-arrow">→</span>
            </div>
          </a>
          <div class="card-management">
            <span class="card-category" title="${escapeHTML(b.category)}">${escapeHTML(b.category)}</span>

          </div>
        </div>
      `}).join('');

      // Bind edit/delete
      grid.querySelectorAll('.card-action-btn.edit').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); editBookmark(+btn.dataset.idx); });
      });
      grid.querySelectorAll('.card-action-btn.delete').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); deleteBookmark(+btn.dataset.idx); });
      });
    }

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Keyboard shortcut: / to focus search, Escape to close modal
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search').focus();
      }
      if (e.key === 'Escape') closeModal();
    });

    // Category autocomplete
    const catInput = document.getElementById('m-cat');
    const catList = document.getElementById('cat-list');
    let catActiveIdx = -1;

    function getExistingCategories() {
      const cats = [...new Set(bookmarks.map(b => b.category).filter(Boolean))];
      // Add default suggestions
      const defaults = ['AI', 'Dev', 'Design', 'Tools', 'Reading', 'News', 'Fun', 'Infra'];
      defaults.forEach(d => { if (!cats.includes(d)) cats.push(d); });
      return cats.sort();
    }

    function renderCatSuggestions(filter) {
      const all = getExistingCategories();
      const q = (filter || '').toLowerCase();
      const matched = q ? all.filter(c => c.toLowerCase().includes(q)) : all;
      if (matched.length === 0) {
        catList.classList.remove('show');
        return;
      }
      // Hide if exact match already typed
      if (matched.length === 1 && matched[0].toLowerCase() === q) {
        catList.classList.remove('show');
        return;
      }
      catActiveIdx = Math.min(catActiveIdx, matched.length - 1);
      catList.innerHTML = matched.map((c, i) =>
        `<div class="autocomplete-item ${i === catActiveIdx ? 'active' : ''}" data-val="${escapeHTML(c)}"><span class="cat-dot"></span>${escapeHTML(c)}</div>`
      ).join('');
      catList.classList.add('show');

      catList.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          delete autoValues['m-cat'];
          catInput.value = item.dataset.val;
          catList.classList.remove('show');
        });
      });
    }

    catInput.addEventListener('focus', () => renderCatSuggestions(catInput.value));
    catInput.addEventListener('input', () => { catActiveIdx = -1; renderCatSuggestions(catInput.value); });
    catInput.addEventListener('blur', () => setTimeout(() => catList.classList.remove('show'), 150));
    catInput.addEventListener('keydown', (e) => {
      const items = catList.querySelectorAll('.autocomplete-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        catActiveIdx = Math.min(catActiveIdx + 1, items.length - 1);
        renderCatSuggestions(catInput.value);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        catActiveIdx = Math.max(catActiveIdx - 1, 0);
        renderCatSuggestions(catInput.value);
      } else if (e.key === 'Enter' && catActiveIdx >= 0) {
        e.preventDefault();
        delete autoValues['m-cat'];
        catInput.value = items[catActiveIdx].dataset.val;
        catList.classList.remove('show');
        catActiveIdx = -1;
      }
    });

    // Add modal
    const modal = document.getElementById('modal');
    const addBtn = document.getElementById('addBtn');

    let modalGeneration = 0;
    function openModal() { modalGeneration++; resetMetadata(); manualFields.clear(); modal.classList.add('active'); document.getElementById('m-url').focus(); }
    function closeModal() { modalGeneration++; resetMetadata(); modal.classList.remove('active'); }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function deleteBookmark(idx) {
      if (!confirm('确定删除这个收藏？')) return;
      try {
        const res = await fetch(`/api/bookmarks?index=${idx}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${ACCESS_CODE}` },
        });
        if (res.ok) {
          bookmarks.splice(idx, 1);
          renderFilters();
          render();
          document.getElementById('stats').textContent = `${bookmarks.length} 个收藏`;
          showToast('✅ 已删除');
        } else {
          showToast('❌ 删除失败');
        }
      } catch (e) { showToast('❌ 网络错误'); }
    }

    let editingIndex = -1;

    function editBookmark(idx) {
      editingIndex = idx;
      const b = bookmarks[idx];
      document.getElementById('m-url').value = b.url || '';
      document.getElementById('m-title').value = b.title || '';
      document.getElementById('m-desc').value = b.description || '';
      document.getElementById('m-cat').value = b.category || '';
      document.getElementById('m-tags').value = (b.tags || []).join(', ');
      document.querySelector('.modal h2').textContent = '✏️ 编辑收藏';
      openModal();
    }

    addBtn.addEventListener('click', () => {
      editingIndex = -1;
      ['m-url','m-title','m-desc','m-cat','m-tags'].forEach(id => document.getElementById(id).value = '');
      document.querySelector('.modal h2').textContent = '✨ 添加收藏';
      openModal();
    });
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // Cancel obsolete requests and never overwrite a user's manual field edits.
    let fetchTimer = null;
    let metadataRequest = null;
    let metadataVersion = 0;
    let lastMetadataURL = '';
    const autoValues = {};
    const manualFields = new Set();

    function resetMetadata() {
      clearTimeout(fetchTimer);
      metadataRequest?.controller.abort();
      metadataRequest = null;
      metadataVersion++;
      lastMetadataURL = '';
      Object.keys(autoValues).forEach(key => delete autoValues[key]);
      document.getElementById('m-fetching').style.display = 'none';
    }

    function normalizeURL(value) {
      value = value.trim();
      if (!value) throw new Error('请输入网址');
      const parsed = new URL(value.includes('://') ? value : `https://${value}`);
      if (!['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) {
        throw new Error('仅支持 HTTP/HTTPS 网址');
      }
      return parsed.href;
    }

    ['m-title', 'm-desc', 'm-cat'].forEach(id => {
      for (const event of ['beforeinput', 'input']) {
        document.getElementById(id).addEventListener(event, () => {
          delete autoValues[id]; manualFields.add(id);
        });
      }
    });
    document.getElementById('m-url').addEventListener('blur', () => {
      clearTimeout(fetchTimer);
      autoFetchMeta();
    });
    document.getElementById('m-url').addEventListener('input', () => {
      // Remove only values we supplied for the previous URL, not manual text.
      Object.entries(autoValues).forEach(([id, value]) => {
        if (document.getElementById(id).value === value) document.getElementById(id).value = '';
      });
      resetMetadata();
      fetchTimer = setTimeout(autoFetchMeta, 800);
    });

    async function autoFetchMeta() {
      if (!modal.classList.contains('active')) return;
      const urlInput = document.getElementById('m-url');
      let url;
      try { url = normalizeURL(urlInput.value); } catch { return; }
      if (lastMetadataURL === url) return;
      if (metadataRequest?.url === url) return metadataRequest.promise;
      metadataRequest?.controller.abort();
      const controller = new AbortController();
      const version = ++metadataVersion;
      const hint = document.getElementById('m-fetching');
      hint.style.display = 'block';
      hint.textContent = '✨ 正在获取网站信息...';
      const request = {url, controller};
      metadataRequest = request;
      request.promise = (async () => {
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
          const res = await fetch('/api/fetch-meta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ACCESS_CODE}` },
            body: JSON.stringify({ url }),
            signal: controller.signal,
          });
          if (!res.ok) {
            if (res.status === 401) throw new Error('访问码已失效，请重新登录');
            if (res.status >= 500) throw new Error('标题解析服务暂时不可用，请手动填写或稍后重试');
            const error = await res.json();
            throw new Error(error.error || '网址无法解析，请手动填写');
          }
          const meta = await res.json();
          if (version !== metadataVersion) return;
          lastMetadataURL = url;
          for (const [id, key] of [['m-title','title'], ['m-desc','description'], ['m-cat','category']]) {
            const input = document.getElementById(id);
            if (meta[key] && !input.value && !manualFields.has(id)) {
              input.value = meta[key];
              autoValues[id] = meta[key];
            }
          }
          hint.textContent = meta.status === 'ok' ? '✅ 已获取网站信息' : `⚠️ ${meta.warning || '未获取到网页标题，暂用域名，请手动确认'}`;
        } catch (error) {
          if (version !== metadataVersion) return;
          hint.textContent = `⚠️ ${error.name === 'AbortError' ? '获取超时，请手动填写或稍后重试' : error.message}`;
        } finally {
          clearTimeout(timeout);
          if (metadataRequest === request) metadataRequest = null;
        }
      })();
      return request.promise;
    }

    document.getElementById('modalSave').addEventListener('click', async () => {
      let url;
      try { url = normalizeURL(document.getElementById('m-url').value); }
      catch (error) { showToast(error.message); return; }

      const saveGeneration = modalGeneration;
      const btn = document.getElementById('modalSave');
      btn.disabled = true;
      btn.textContent = '保存中...';

      clearTimeout(fetchTimer);
      if (!document.getElementById('m-title').value.trim()) await autoFetchMeta();
      if (!modal.classList.contains('active') || saveGeneration !== modalGeneration) {
        btn.disabled = false; btn.textContent = '保存'; return;
      }
      let currentURL;
      try { currentURL = normalizeURL(document.getElementById('m-url').value); } catch {}
      if (currentURL !== url) {
        btn.disabled = false; btn.textContent = '保存'; showToast('网址已更改，请重新保存'); return;
      }
      const tags = document.getElementById('m-tags').value.trim();
      const body = {
        url,
        title: document.getElementById('m-title').value.trim() || new URL(url).hostname,
        description: document.getElementById('m-desc').value.trim(),
        category: document.getElementById('m-cat').value.trim() || 'Uncategorized',
        tags: tags ? tags.split(',').map(t => t.trim()).filter(Boolean) : [],
      };

      try {
        let res;
        if (editingIndex >= 0) {
          // Edit mode
          res = await fetch(`/api/bookmarks?index=${editingIndex}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ACCESS_CODE}` },
            body: JSON.stringify(body),
          });
          if (res.ok) {
            const updated = await res.json();
            bookmarks[editingIndex] = updated;
            renderFilters();
            render();
            closeModal();
            showToast('✅ 已更新');
          } else {
            showToast('❌ 更新失败');
          }
        } else {
          // Add mode
          res = await fetch('/api/bookmarks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ACCESS_CODE}` },
            body: JSON.stringify(body),
          });
          if (res.ok) {
            const added = await res.json();
            bookmarks.push(added);
            renderFilters();
            render();
            document.getElementById('stats').textContent = `${bookmarks.length} 个收藏`;
            closeModal();
            showToast('✅ 已添加');
            ['m-url','m-title','m-desc','m-cat','m-tags'].forEach(id => document.getElementById(id).value = '');
          } else {
            showToast('❌ 保存失败');
          }
        }
      } catch (err) {
        showToast('❌ 网络错误');
      }
      btn.disabled = false;
      btn.textContent = '保存';
    });

    // Only init if already authenticated
    if (sessionStorage.getItem('mineral_access') === 'granted') {
      document.getElementById('access-gate').style.display = 'none';
      init();
    }
  </script>
</body>
</html>
